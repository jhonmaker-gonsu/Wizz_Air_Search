name: Update Wizz Air availability

on:
  schedule:
    # PDF is regenerated daily at 07:00 CET (05:00 UTC / 14:00 JST).
    # 07:00 UTC = 16:00 JST — matches the local launchd job
    # com.wizzflightcheck.pdfcheck on the maintainer's Mac.
    # NOTE: GitHub-hosted cron is best-effort and runs late under load;
    # observed drift on this repo is 31-71 min. Harmless — the PDF has
    # been static since 05:00 UTC.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      probe_sources:
        description: 'Also probe the auto-add data sources (Wizz station list, OurAirports, Wikimedia) and report reachability in the step summary'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Download latest availability PDF
        run: curl --fail --location --retry 3 --output /tmp/aycf-availability.pdf https://multipass.wizzair.com/aycf-availability.pdf

      - name: Update route data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_ADD_AIRPORTS: ${{ vars.AUTO_ADD_AIRPORTS }}
          AUTOADD_PROBE: ${{ inputs.probe_sources }}
        run: node scripts/update-routes-from-pdf.js /tmp/aycf-availability.pdf

      - name: Commit and push changes
        run: |
          git add data.js index.html README.md auto-added-airports.json
          if git diff --cached --quiet; then
            echo 'No route-data changes found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Wizz Air availability'
          git push
