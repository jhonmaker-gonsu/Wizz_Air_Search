name: Update Wizz Air availability

on:
  schedule:
    # PDF is regenerated daily at 07:00 CET (05:00 UTC / 14:00 JST).
    # 07:00 UTC = 16:00 JST — matches the local launchd job
    # com.wizzflightcheck.pdfcheck on the maintainer's Mac.
    # NOTE: GitHub-hosted cron is best-effort and runs late under load;
    # typically several hours late (observed ~5-6.5 h, Sept 2026).
    # Harmless — the PDF has been static since 05:00 UTC.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      probe_sources:
        description: 'Also probe the auto-add data sources (Wizz station list API, OurAirports, Wikipedia, Wikidata; honest repo User-Agent only) and report reachability in the step summary'
        type: boolean
        default: false
      probe_ai:
        description: 'Run the REAL Gemini resolver on 2 known airports (Sibiu, Niš) and compare with data.js. At most 4 Gemini requests, no retries; forces a dry run (no data change, nothing to commit)'
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time (a manual dispatch overlapping the cron run would race on `git push`).
# A second trigger waits instead of cancelling the running one; each run checks out main
# after the previous run's push. Separate from static.yml's "pages" group on purpose.
concurrency:
  group: update-routes
  cancel-in-progress: false

jobs:
  update-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Download latest availability PDF
        # --max-time bounds each attempt (a stalled transfer would otherwise hang until the job timeout);
        # --retry-max-time stops retrying after 4 min so the auto-add budget still fits in timeout-minutes.
        run: curl --fail --location --retry 3 --max-time 120 --retry-max-time 240 --output /tmp/aycf-availability.pdf https://multipass.wizzair.com/aycf-availability.pdf

      - name: Update route data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_ADD_AIRPORTS: ${{ vars.AUTO_ADD_AIRPORTS }}
          AUTOADD_PROBE: ${{ inputs.probe_sources }}
          AUTOADD_PROBE_AI: ${{ inputs.probe_ai }}
        run: node scripts/update-routes-from-pdf.js /tmp/aycf-availability.pdf

      - name: Commit and push changes
        run: |
          git add data.js index.html README.md auto-added-airports.json
          if git diff --cached --quiet; then
            echo 'No route-data changes found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Wizz Air availability'
          git push
